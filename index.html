<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oovets</title>
<style>
  :root{
    --bg:#1e1e1e; --fg:#c8d3c8; --green:#5fd75f; --accent:#8ae234; --mut:#6f7f6f;
    --line:#2f3a2f; --card:#181818;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.6 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  main{width:100%; max-width:680px}
  h1{font-size:22px; margin:0 0 2px; color:var(--green); font-weight:600; letter-spacing:.5px}
  h1::after{
    content:"\2588"; color:var(--green); margin-left:.12em;
    animation:blink 1.05s steps(1) infinite;
  }
  .sub{color:var(--mut); margin:0 0 28px}
  .prompt{color:var(--accent)}
  ul{list-style:none; margin:0; padding:0}
  li{
    border:1px solid var(--line); border-radius:6px; background:var(--card);
    padding:14px 16px; margin:10px 0; transition:border-color .15s;
  }
  li:hover{border-color:var(--green)}
  a.proj{color:var(--green); text-decoration:none; font-size:16px; font-weight:600}
  a.proj:hover{color:var(--accent); text-decoration:underline}
  .desc{color:var(--fg); margin-top:4px; font-size:13.5px}
  .meta{color:var(--mut); font-size:12px; margin-top:4px}
  footer{color:var(--mut); font-size:12px; margin-top:28px}
  footer a{color:var(--mut)}
  @media (prefers-reduced-motion:reduce){ h1::after{animation:none} }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
</head>
<body>
<main>
  <h1>oovets</h1>
  <p class="sub"><span class="prompt">~ $</span> small projects, mostly monitoring &amp; infra</p>
  <ul>
    <li>
      <a class="proj" href="/smokemon/">smokemon</a>
      <div class="desc">passive + active network and host monitor for macOS and Linux (Pi / Jetson),
        with a central hub, incident analysis, and a live fleet dashboard.</div>
      <div class="meta">stdlib-only on the node · <a href="https://github.com/oovets/smokemon" style="color:var(--mut)">source</a></div>
    </li>
  </ul>
  <footer><a href="https://github.com/oovets">github.com/oovets</a></footer>
</main>
</body>
</html>
